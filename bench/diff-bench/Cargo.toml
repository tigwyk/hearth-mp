[package]
name = "diff-bench"
description = "Hearth v0.4 Task 2: per-pass diff cost, full view per client vs one public diff + owner diffs."
version = "0.0.0"
edition = "2021"
publish = false

# Its own workspace: this is a benchmark, not part of the framework build, and
# the main workspace manifest is owned by the Lead.
[workspace]

[dependencies]
# Path dependency on a member of the main workspace: Cargo resolves the member's
# own workspace root for inherited fields, so this does not need root changes.
hearth-mp-sync = { path = "../../crates/hearth-mp-sync", version = "0.1.0" }
serde_json = "1.0.154"
