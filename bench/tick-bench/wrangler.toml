name = "hearth-tick-bench"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"

[build]
command = "worker-build --release"

[[durable_objects.bindings]]
name = "ALARM_TICKER"
class_name = "AlarmTicker"

[[durable_objects.bindings]]
name = "LOOP_TICKER"
class_name = "LoopTicker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AlarmTicker", "LoopTicker"]
