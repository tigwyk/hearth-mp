[package]
name = "arena-dedicated-server"
description = "Hearth v0.5 sample: dedicated arena server for the Cloudflare Containers adapter."
version = "0.0.0"
edition = "2021"
publish = false

# Its own workspace: the sample must never join the framework workspace.
[workspace]

[dependencies]
# The Rust SDK for dedicated servers: redeem, report, heartbeat.
hearth-handoff-server = { path = "../../../crates/hearth-handoff-server" }
# Shared protocol types (PlayerId, ServerReport, ...).
hearth-server = { path = "../../../crates/hearth-server" }
futures-util = "0.3.34"
serde_json = "1.0.154"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util", "sync"] }
tokio-tungstenite = "0.30"
