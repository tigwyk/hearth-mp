[workspace]
resolver = "2"
members = [
    "crates/*",
    "examples/arena",
    "examples/arena-dedicated",
    "examples/arena-godot-ext",
    "examples/arena-logic",
    "examples/tictactoe",
]
# Builds its own cdylib named hearth_unity; see its Cargo.toml.
exclude = ["examples/arena-unity-plugin"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
authors = ["Lee Ingram <lee@soylentcola.com>"]
repository = "https://github.com/tigwyk/hearth-mp"
readme = "README.md"
keywords = ["multiplayer", "gamedev", "websocket", "cloudflare", "durable-objects"]
categories = ["game-development", "network-programming"]

[workspace.dependencies]
# External crates, pinned once for the whole workspace.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rmp-serde = "1.3.1"
thiserror = "2.0.21"
anyhow = "1.0.104"
futures = "0.3.34"
worker = "0.8.7"
godot = "0.5.5"
hmac = "0.12.1"
sha2 = "0.10.8"
base64 = "0.22.1"
getrandom = { version = "0.2.15", features = ["js"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
fastrand = "2.5.0"
proptest = "1.12.0"
trybuild = "1.0.122"
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
# `hearth-mp inspect` (v0.2c): blocking HTTP and a WebSocket client for the CLI.
ureq = { version = "3.5.0", features = ["json"] }
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
# The conformance reference server (v1.0a): a local tokio WebSocket host.
tokio = { version = "1.48.0", features = ["rt", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite = "0.30.0"
# `hearth-mp cost` (v0.3b): the versioned pricing table is TOML, not code.
toml = "1.1.8"

# Workspace crates.
hearth-mp-protocol = { path = "crates/hearth-mp-protocol", version = "0.1.0" }
hearth-mp-sync = { path = "crates/hearth-mp-sync", version = "0.1.0" }
hearth-mp-sync-derive = { path = "crates/hearth-mp-sync-derive", version = "0.1.0" }
hearth-mp-client = { path = "crates/hearth-mp-client", version = "0.1.0" }
hearth-mp-server = { path = "crates/hearth-mp-server", version = "0.1.0" }
hearth-mp-server-macros = { path = "crates/hearth-mp-server-macros", version = "0.1.0" }
hearth-mp = { path = "crates/hearth-mp", version = "0.1.0" }
hearth-mp-gateway = { path = "crates/hearth-mp-gateway", version = "0.1.0" }
hearth-mp-test = { path = "crates/hearth-mp-test", version = "0.1.0" }
hearth-mp-cli = { path = "crates/hearth-mp-cli", version = "0.1.0" }
hearth-mp-godot = { path = "crates/hearth-mp-godot", version = "0.1.0" }
hearth-mp-admin = { path = "crates/hearth-mp-admin", version = "0.1.0" }
hearth-mp-matchmaker = { path = "crates/hearth-mp-matchmaker", version = "0.1.0" }
tictactoe = { path = "examples/tictactoe", version = "0.1.0" }

# Wasm bundle size (v1.0a, docs/limits.md "Bundle size"). No `panic = "abort"`:
# the profile is workspace-wide and the FFI crates catch panics by unwinding.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
