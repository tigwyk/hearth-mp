[workspace]
resolver = "2"
members = ["crates/*", "examples/tictactoe"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
authors = ["Lee Ingram <lee@soylentcola.com>"]

[workspace.dependencies]
# External crates, pinned once for the whole workspace.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rmp-serde = "1.3.1"
thiserror = "2.0.21"
anyhow = "1.0.104"
futures = "0.3.34"
worker = "0.8.7"
godot = "0.5.5"
hmac = "0.12.1"
sha2 = "0.10.8"
base64 = "0.22.1"
getrandom = { version = "0.2.15", features = ["js"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
fastrand = "2.5.0"
proptest = "1.12.0"
trybuild = "1.0.122"
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
# `hearth inspect` (v0.2c): blocking HTTP and a WebSocket client for the CLI.
ureq = { version = "3.5.0", features = ["json"] }
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

# Workspace crates.
hearth-protocol = { path = "crates/hearth-protocol", version = "0.1.0" }
hearth-sync = { path = "crates/hearth-sync", version = "0.1.0" }
hearth-sync-derive = { path = "crates/hearth-sync-derive", version = "0.1.0" }
hearth-client = { path = "crates/hearth-client", version = "0.1.0" }
hearth-server = { path = "crates/hearth-server", version = "0.1.0" }
hearth-server-macros = { path = "crates/hearth-server-macros", version = "0.1.0" }
hearth = { path = "crates/hearth", version = "0.1.0" }
hearth-gateway = { path = "crates/hearth-gateway", version = "0.1.0" }
hearth-test = { path = "crates/hearth-test", version = "0.1.0" }
hearth-cli = { path = "crates/hearth-cli", version = "0.1.0" }
hearth-godot = { path = "crates/hearth-godot", version = "0.1.0" }
hearth-admin = { path = "crates/hearth-admin", version = "0.1.0" }
tictactoe = { path = "examples/tictactoe", version = "0.1.0" }
