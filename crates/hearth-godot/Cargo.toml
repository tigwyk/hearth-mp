[package]
name = "hearth-godot"
description = "Hearth v0.1 Godot 4 GDExtension client: HearthNative node driving ClientCore over a WebSocketPeer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# `rlib` is needed for the native `tests/convert.rs` integration test; the
# cdylib is what Godot loads.
crate-type = ["cdylib", "rlib"]

[dependencies]
# api-4-3 keeps the plan's "Godot >= 4.3" runtime support. Prebuilt bindings
# mean building needs no Godot binary.
godot = { workspace = true, features = ["api-4-3"] }
hearth-client.workspace = true
hearth-protocol.workspace = true
serde_json.workspace = true
