language = "C"
include_guard = "HEARTH_UNITY_H"
header = "/* Generated by cbindgen from crates/hearth-unity-plugin: do not edit. */"
cpp_compat = true

[export]
include = ["HearthBuf"]

# The exports come from `hearth_unity_core::plugin!`, so cbindgen reads the
# macro-expanded crate (needs RUSTC_BOOTSTRAP=1 on a stable toolchain).
[parse]
parse_deps = true
include = ["hearth-unity-core"]

[parse.expand]
crates = ["hearth-unity-plugin"]
