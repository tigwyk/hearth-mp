# Hearth's monthly-cost model prices.
#
# Prices are data, not code: every number Cloudflare charges lives here, so a
# price change is a data edit and a new `as_of`, not a code change. Refresh all
# values from the pages in `sources` and update `as_of` on the same day.
#
# Units: USD per million requests / GB-s / rows, or USD per GB-month for stored
# data. `hearth cost` embeds this file at build time; `--pricing <file>` reads a
# different table (for next month's prices, or a negotiated Enterprise rate).
as_of = "2026-10-25"
sources = [
    "https://developers.cloudflare.com/workers/platform/pricing/",
    "https://developers.cloudflare.com/durable-objects/platform/pricing/",
]

[workers]
# Workers Paid plan (Standard usage model): $5/month minimum, which includes the
# first 10 million requests.
base_usd_month = 5.0
requests_included = 10000000
usd_per_million_requests = 0.30

[durable_objects]
# SQLite-backed Durable Objects on the Workers Paid plan. Requests include HTTP
# requests, RPC sessions, WebSocket messages and alarm invocations.
requests_included = 1000000
usd_per_million_requests = 0.15
# Duration is billed for the full 128 MB every object is allocated, regardless
# of actual memory use.
gb_s_included = 400000
usd_per_million_gb_s = 12.5
memory_gb = 0.128
# Incoming WebSocket messages bill at 20 messages : 1 request; outgoing messages
# and protocol pings are free.
ws_incoming_ratio = 20
# SQLite storage (billed since 2026-01-07). The model writes one state row per
# handler pass in event mode, or one per persist_every_ticks in ticked mode.
rows_written_included = 50000000
usd_per_million_rows_written = 1.0
storage_gb_included = 5.0
usd_per_gb_month = 0.20

[model]
# 30.4-day average month. The model bills one continuous month.
seconds_per_month = 2628000
# An event-mode room stays in memory for this long after its last message before
# Workerd can hibernate it; that window is the duration it is billed for.
idle_hibernate_after_s = 10
