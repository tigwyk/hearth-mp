[package]
name = "hearth-unity-core"
description = "Hearth Unity native plugin implementation: panic-safe C ABI and WebGL bodies over hearth-client, emitted into a plugin crate by `plugin!`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# Only an rlib: `plugin!` emits the exports into the plugin cdylib
# (crates/hearth-unity-plugin, or a game's own crate).
crate-type = ["rlib"]

[dependencies]
hearth-client.workspace = true
hearth-protocol.workspace = true
serde_json.workspace = true
